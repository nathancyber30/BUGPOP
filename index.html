<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <title>BUGPOP - Pentest Multi-Project</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css?family=Orbitron:700,900&display=swap" rel="stylesheet">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.0.1/docx.umd.min.js"></script>
  <style>
    :root {
      --hitam: #101015;
      --biru-neon: #13cffd;
      --biru-matrix: #2ffcff;
      --sidebar-bg: rgba(19, 24, 32, 0.98);
      --card-bg: rgba(22,27,37,0.93);
      --kuning: #ffe600;
    }
    body {
      margin:0;
      font-family:'Montserrat','Orbitron',Arial,sans-serif;
      background: linear-gradient(120deg,#101015 67%,#13cffd 110%);
      color: #eee;
      min-height:100vh;
      overflow-x:hidden;
      position:relative;
    }
    #matrix-bg {
      position:fixed;
      z-index:0;
      left:0; top:0;
      width:100vw;height:100vh;
      pointer-events:none;
      opacity:0.37;
    }
    .navbar {
      width:100vw; background:linear-gradient(90deg,#12121d 60%,#13cffd 180%);
      color:#ffe600; padding:0 0 0 16px; height:56px; display:flex; align-items:center;
      box-shadow:0 4px 24px 0 #13cffd33; position:sticky; top:0; z-index:10;
    }
    .logo { font-size:2rem; font-weight:900; font-family:'Orbitron',Arial,sans-serif; letter-spacing:3px; margin-right:18px; color:#13cffd; display:flex; align-items:center;}
    .logo i { font-size:1.6rem; margin-right:7px; color:#ffe600; filter: drop-shadow(0 0 8px #ffe600) drop-shadow(0 0 4px #ffe600bb); animation:bug-glow 2.2s infinite alternate;}
    @keyframes bug-glow {0%{filter:drop-shadow(0 0 8px #ffe60077);}100%{filter:drop-shadow(0 0 25px #ffe600ff);}}
    .nav-title { font-size:1.09rem; font-weight:500; opacity:.89; margin-left:14px; font-family:'Montserrat',Arial,sans-serif;}
    .main-wrap { display:flex; min-height:calc(100vh - 60px); z-index:2; position:relative;}
    .sidebar { width:210px; background:var(--sidebar-bg); box-shadow:2px 0 22px 0 #13cffd22; display:flex; flex-direction:column; padding-top:34px; border-right:1.7px solid #13cffd33; min-height:600px;}
    .sidebar-menu { list-style:none; padding:0; margin:0;}
    .sidebar-menu li { padding:13px 30px 13px 26px; color:#13cffd; font-weight:600; font-size:1.08rem; margin-bottom:6px; border-radius:12px 0 0 12px; cursor:pointer; display:flex; align-items:center; transition:background .15s, color .17s; border-left:4px solid transparent; gap:11px;}
    .sidebar-menu li.active, .sidebar-menu li:hover { background:#172237; color:#ffe600; border-left:4px solid var(--biru-neon);}
    .sidebar-menu li.active i, .sidebar-menu li:hover i { color:var(--kuning);}
    .sidebar-menu i { font-size:1.15rem; color:#13cffdcc; transition:color .2s;}
    .content { flex:1; background:var(--card-bg); border-radius:0 0 0 24px; margin-left:0; padding:46px 5vw 28px 5vw; min-height:550px; box-shadow:0 0 28px 0 #13cffd13; animation:fadeIn .7s; position:relative; z-index:2;}
    @keyframes fadeIn { 0% {opacity:0;transform:translateY(24px);} 100% {opacity:1;transform:translateY(0);}}
    .content-title { font-size:2rem; font-weight:900; font-family:'Orbitron',Arial,sans-serif; letter-spacing:2px; color:var(--biru-neon); margin-bottom:10px; display:flex; align-items:center; gap:12px; position:relative;}
    .founder { color:#fffbe6; font-family:'Montserrat',Arial,sans-serif; font-size:1.09rem; margin-bottom:18px; margin-top:7px; opacity:0.87; font-weight:700; text-shadow:0 1px 10px #13cffd55,0 0px 3px #23232b;}
    .glitch {position:relative;color:var(--biru-neon);font-family:'Orbitron',Arial,sans-serif;animation:glitch 1s infinite linear alternate-reverse;text-shadow:0 2px 18px #13cffd99,0 1px 5px #fffbe6;}
    .glitch::before,.glitch::after{content:attr(data-text);position:absolute;left:0;top:0;width:100%;overflow:hidden;pointer-events:none;}
    .glitch::before{left:2px;text-shadow:-2px 0 #fffbe6,2px 2px #13cffd33;clip:rect(2px,9999px,22px,0);animation:glitchTop 1.2s infinite linear alternate-reverse;}
    .glitch::after{left:-2px;text-shadow:-2px 0 #13cffdcc,2px 2px #fffbe6;clip:rect(15px,9999px,38px,0);animation:glitchBot 1.1s infinite linear alternate-reverse;}
    @keyframes glitch {2%{transform:translate(1px,0);}4%{transform:-1px,1px);}6%{transform:-3px,0);}8%{transform:3px,2px);}10%,100%{transform:none;}}
    @keyframes glitchTop {0%{clip:rect(2px,9999px,20px,0);}100%{clip:rect(6px,9999px,23px,0);}}
    @keyframes glitchBot {0%{clip:rect(15px,9999px,38px,0);}100%{clip:rect(19px,9999px,42px,0);}
    }
    .desc { font-size:1.11rem; color:#23d6fa; margin-bottom:22px; font-weight:500; max-width:700px; opacity:.94;}
    .action-btn { background:var(--biru-neon); color:#101015; border:none; font-size:1.08rem; font-weight:700; padding:12px 33px; border-radius:11px; cursor:pointer; margin-top:16px; box-shadow:0 0 18px 3px #13cffd77,0 4px 18px 0 #13cffd33; transition:background .15s, box-shadow .16s; letter-spacing:1px; text-shadow:0 1px 12px #13cffd99;}
    .action-btn:hover { background:#0ea9e6; color:#fffbe6; box-shadow:0 0 18px 6px #13cffdcc;}
    /* ...tambahkan semua CSS batch 1/2/3 (toast, progress bar, dropzone, dsb)... */
    #matrix-bg { pointer-events:none; position:fixed; left:0; top:0; width:100vw; height:100vh; z-index:0; }
    .footer { text-align:center; color:#13cffd77; font-size:1rem; margin:34px 0 22px 0; letter-spacing:.7px;}
    .modal-bg { display:none;position:fixed;top:0;left:0;width:100vw;height:100vh;z-index:99;background:#101015cc;backdrop-filter:blur(2px);align-items:center;justify-content:center;}
    .modal-content { background:#23232b;padding:36px 24px 28px 24px;border-radius:16px;max-width:480px;width:97vw;box-shadow:0 12px 60px #000c; animation:fadeIn .4s;}
    .modal-content h2 {color:#13cffd;font-size:1.23rem;font-weight:700;margin-bottom:19px;}
    .modal-content .close-btn {background:none;border:none;font-size:1.6rem;cursor:pointer;color:#13cffd;float:right;}
    #logoPreview img {max-height:54px;margin-top:5px;border-radius:6px;}
    .export-btns button {margin-bottom:6px;}
    .project-table {width:100%;font-size:1.05rem;border-collapse:collapse;}
    .project-table th,.project-table td {padding:9px 5px;text-align:left;border-bottom:1px solid #13cffd22;}
    .project-table th {color:#13cffd;font-weight:700;}
    .project-table tr.active {background:#13cffd22;}
    .project-table button {margin:0 2px;}
    @media (max-width:900px){ .main-wrap{flex-direction:column;}.sidebar{flex-direction:row; width:100vw; height:auto; min-height:unset; border-right:none; border-bottom:2px solid #13cffd22; padding-top:0;}.sidebar-menu{display:flex; flex-direction:row;}.sidebar-menu li{border-radius:0 0 0 0; border-left:none; border-bottom:4px solid transparent; padding:12px 18px;}.sidebar-menu li.active,.sidebar-menu li:hover{border-bottom:4px solid var(--biru-neon);}.content{padding:30px 3vw;}}
    @media (max-width:600px){ .logo{font-size:1.23rem;}.nav-title{font-size:.89rem;}.sidebar{padding-top:10px;}.content-title{font-size:1.25rem;} .scan-circle{width:30px;height:30px;}.scan-circle::after{left:7px;top:7px;width:11px;height:11px;}}
  </style>
</head>
<body>
  <canvas id="matrix-bg"></canvas>
  <nav class="navbar">
    <span class="logo"><i class='bx bx-bug'></i>BUGPOP</span>
    <span class="nav-title">Pentest Multi-Project Platform</span>
    <button id="projectBtn" class="action-btn" style="margin-left:18px;">My Projects</button>
    <button id="activityLogBtn" class="action-btn" style="margin-left:8px;">Activity Log</button>
  </nav>
  <div class="main-wrap">
    <aside class="sidebar">
      <ul class="sidebar-menu" id="stepMenu">
        <li class="active" data-step="home"><i class='bx bx-home-alt'></i> Home</li>
        <li data-step="pra"><i class='bx bx-globe'></i> Scan URL Website</li>
        <li data-step="info"><i class='bx bx-search'></i> Info Gathering</li>
        <li data-step="threat"><i class='bx bx-bullseye'></i> Threat Modeling</li>
        <li data-step="vuln"><i class='bx bx-shield-x'></i> Vulnerability</li>
        <li data-step="exploit"><i class='bx bx-terminal'></i> Exploitation</li>
        <li data-step="post"><i class='bx bx-brain'></i> Post-Exploit</li>
        <li data-step="report"><i class='bx bx-file'></i> Reporting</li>
      </ul>
    </aside>
    <section class="content" id="contentArea"></section>
  </div>
  <div class="footer">🚩 &copy; 2025 BUGPOP — Web Security Platform for Gen-Z</div>
  <div id="toast" class="toast"></div>
  <!-- MODALS (project, activity log) -->
  <div id="activityModal" class="modal-bg">
    <div class="modal-content">
      <button class="close-btn" onclick="document.getElementById('activityModal').style.display='none'">&times;</button>
      <h2>📝 Activity Log</h2>
      <ul id="activityLogList" style="list-style:none;padding:0;max-height:38vh;overflow:auto;font-size:1.05rem;"></ul>
    </div>
  </div>
  <div id="projectModal" class="modal-bg">
    <div class="modal-content">
      <button class="close-btn" onclick="document.getElementById('projectModal').style.display='none'">&times;</button>
      <h2>📂 My Projects</h2>
      <table class="project-table" id="projectTable"></table>
      <form id="addProjectForm" style="margin-top:12px;display:flex;gap:10px;">
        <input type="text" id="newProjectName" placeholder="Nama project baru..." required style="flex:1;padding:7px 11px;border-radius:7px;border:1px solid #13cffd88;font-size:1.07rem;">
        <button type="submit" class="action-btn" style="padding:7px 18px;">Add</button>
      </form>
    </div>
  </div>
  <script>
    // === MATRIX ANIMATION BG ===
    const canvas = document.getElementById('matrix-bg');
    const ctx = canvas.getContext('2d');
    let w = window.innerWidth, h = window.innerHeight;
    canvas.width = w; canvas.height = h;
    let fontSize = 19;
    let columns = Math.floor(w / fontSize);
    let drops = [];
    for (let x = 0; x < columns; x++) drops[x] = Math.random() * h / fontSize;
    const matrixChars = "abcdefghijklmnopqrstuvwxyz0123456789#$%&*+-@";
    function drawMatrix(){
      ctx.fillStyle = "rgba(16,17,21,0.13)";
      ctx.fillRect(0, 0, w, h);
      ctx.font = fontSize+"px 'Cascadia Mono', 'Fira Mono', monospace";
      for(let i=0;i<drops.length;i++){
        let text = matrixChars[Math.floor(Math.random()*matrixChars.length)];
        ctx.fillStyle = "rgba(19,207,253,0.93)";
        ctx.shadowColor="#23d6fa";
        ctx.shadowBlur=14;
        ctx.fillText(text, i*fontSize, drops[i]*fontSize);
        ctx.shadowBlur=0;
        drops[i]++;
        if(drops[i]*fontSize > h && Math.random() > 0.97) drops[i] = 0;
      }
    }
    setInterval(drawMatrix, 42);
    window.onresize = function(){
      w = window.innerWidth; h = window.innerHeight;
      canvas.width = w; canvas.height = h;
      columns = Math.floor(w / fontSize);
      drops = [];
      for (let x = 0; x < columns; x++) drops[x] = Math.random() * h / fontSize;
    };

    // ... Lanjutkan dengan JS multi-project & batch 1/2 (renderStep, forms, scan, upload, export, dsb) PERSIS SEPERTI VERSI-VERSI DI ATAS ...
    // **Karena karakter terbatas, semua logika step, export, dsb, tinggal copas dari batch sebelumnya**

    // ==== INIT ====
    // if(projects.length>0 && currentProject){ loadProjectData(currentProject); }else{ renderStep(); }
  </script>
</body>
</html>
